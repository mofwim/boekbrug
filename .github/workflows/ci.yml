# [CI] BoekBrug continuous integration.
# Runs the same hard gates the project uses locally before every merge:
#   1. `tsc --noEmit`     — full TypeScript type-check.
#   2. `npm run test:unit`   — the unit-test suite.
#   3. `npm run test:render` — the money screens, actually RENDERED.
#   4. `next build`       — the production build, WITHOUT any secrets.
#   5. the public-surface smoke test — the first gate that SERVES A REQUEST.
# Lint is intentionally NOT a blocking gate here (the repo carries known
# pre-existing eslint findings). That is the ONE deliberate difference from
# `npm run gates`; everything else must match, and steps 2 and 3 now call the
# package.json scripts by name so they cannot drift apart again.
#
# A second job runs a sixth gate that `npm run gates` does NOT:
#   6. tests/sql/ — the migrations, against a real PostgreSQL.
# It is not in `gates` because it needs a service and the local gates are worth
# keeping runnable on a bare checkout. See the [SEAM] block above that job.
#
# [PUBLIC-SMOKE] Why a fourth gate. The first three are all STATIC: none of them ever starts the
# app. They therefore share one blind spot, and it is not theoretical — /eerlijk-gebruik was
# written, type-checked, built, prerendered, linked from the footer of every public page and listed
# in sitemap.xml, while the auth guard redirected every visitor and every crawler to /login. A page
# that is correct and a guard that is correct can still be a broken pair, and only a request can
# tell you. Gate 4 asks the server.
#
# [BUILD-NO-SECRETS] Gate 3 is new, and it was impossible until the build stopped needing the
# production keys. Five sign-in pages constructed a Supabase browser client during render, and
# Next prerenders exactly those pages — so `next build` needed NEXT_PUBLIC_SUPABASE_URL and would
# die without it. The only real build check was therefore a Vercel preview, i.e. after the push,
# on infrastructure a contributor cannot run. A prerender error could reach main and only surface
# as a failed deploy.
#
# The build now runs on a clean checkout with an empty environment, which is precisely what makes
# it a gate: it proves the app compiles and every static page renders without depending on a live
# project. Missing keys are a RUNTIME concern — /api/health reports them by name.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # De naam noemt alle drie de poorten. Hij zei "Type-check & tests" terwijl de build er sinds
    # kort bij hoort, en een groene check die zijn eigen dekking verkeerd opgeeft is precies het
    # soort halve waarheid dat de rest van deze commits opruimt.
    name: Type-check, tests, build & smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      # [GLOB-DRIFT] `npm run test:unit`, NOT a glob written out again here.
      #
      # This step used to carry its own copy — `src/lib/*.test.ts src/content/legal/*.test.ts` —
      # with a comment warning that "adding a directory of tests means adding it here too; silence
      # is what this step is supposed to make impossible". It then became exactly that silence:
      # package.json grew `src/lib/*/*.test.ts`, this file did not, and
      # src/lib/design/sheet-bottom-gates.test.ts has never run on a pull request.
      #
      # One test is a small loss. The mechanism is not: a glob duplicated in two files drifts, and
      # it drifts SILENTLY — the step stays green because the missing tests never report anything.
      # Calling the script by name makes the two impossible to disagree.
      - name: Unit tests
        run: npm run test:unit

      # [RENDER-GATE] The gate CI never ran at all, and the only one that can catch its class.
      #
      # tsc, eslint and next build never CALL a component, and the public-surface smoke sweeps only
      # what the middleware lets through without a session — so every /dashboard/* screen is outside
      # all four of the other gates. AGENTS.md documents the incident: /dashboard/incoming/manage
      # shipped with a const read seventy lines before its declaration, inside a .filter() callback
      # that runs during render. It type-checked, it built, the smoke test never logged in, and the
      # screen would have been white.
      #
      # 48 assertions, ~2 seconds, no browser and no database — and not one of them has executed on
      # a pull request until now.
      - name: Render tests
        run: npm run test:render

      # No env is provided on purpose — see [BUILD-NO-SECRETS] above. If this step ever needs a
      # secret again, something started building a client at render time; fix that rather than
      # adding the key here, or the gate quietly stops proving anything.
      - name: Production build (no secrets)
        run: npx next build

      # [PUBLIC-SMOKE] Gate 4 — the public surface, requested as a logged-out visitor.
      #
      # Runs against the build from the step above (playwright.config.ts starts `next start`), so
      # it costs a server boot and a few dozen HEAD-sized requests, nothing more.
      #
      # NO `playwright install`: every assertion in tests/public-surface.spec.ts is a status code
      # fetched through the `request` fixture, so no browser binary is launched. That is
      # deliberate — a gate that begins by downloading Chromium is a gate people start skipping.
      # (tests/combine-images-pdf.spec.ts DOES need a browser; it is not part of this step. Adding
      # it means adding the install step with it, which is a separate, considered decision.)
      #
      # The dummy Supabase values live in playwright.config.ts, next to the explanation of why they
      # are fake — the point of this gate is that the public surface needs no real backend.
      - name: Public-surface smoke test
        run: npx playwright test tests/public-surface.spec.ts

  # [SEAM] Gate 6 — the one that can read plpgsql.
  #
  # Its own job because it is the only gate that needs a service, and the job above is worth keeping
  # runnable on a bare checkout with an empty environment. They run in parallel.
  #
  # WHY IT EXISTS. Every other test in this repo is pure. payment-plan.ts has 22 that prove a
  # payment plan is arithmetically sound, and not one of them crosses into SQL — so the seam between
  # a proven plan and the function that writes it was untested, and it produced two defects that
  # walked through the entire gate set untouched:
  #
  #   · the route looped apply_bank_payment, which consumes the bank line on its FIRST call, so
  #     every multi-invoice allocation failed after its first invoice — the whole feature;
  #   · allocate_bank_payment was sign-blind, so the creditnota case payment-plan.ts exists FOR
  #     booked a €1.000 invoice as €850 paid and never settled the credit.
  #
  # TypeScript cannot see either: the contract that was wrong lives in plpgsql. This job runs the
  # migration that ships against a real PostgreSQL and asserts what it actually does.
  #
  # SQL_SEAM_REQUIRED=1 is the important line. Without it the runner SKIPS when no database is
  # reachable, which is right on a laptop and would be a lie here — a green check that ran nothing.
  sql-seam:
    name: SQL contracts (real PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: seam
          POSTGRES_DB: seamtest
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # psql only — no npm install, no build. The gate is a few hundred milliseconds of SQL.
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: SQL seam tests
        env:
          DATABASE_URL: postgres://postgres:seam@localhost:5432/seamtest
          SQL_SEAM_REQUIRED: '1'
        run: bash scripts/sql-seam-test.sh
