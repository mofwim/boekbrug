# [CI] BoekBrug continuous integration.
# Runs the same two hard gates the project uses locally before every merge:
#   1. `tsc --noEmit`  — full TypeScript type-check.
#   2. `tsx --test`    — the unit-test suite under src/lib.
# Lint is intentionally NOT a blocking gate here (the repo carries known
# pre-existing eslint findings); Vercel's per-PR preview build covers the
# production `next build`. Keep this workflow to the checks that must be green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx tsx --test src/lib/*.test.ts
